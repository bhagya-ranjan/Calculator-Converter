<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Numeral System</title>
    <link rel = "stylesheet" href = "style_num.css">
    <link rel = "stylesheet" href = "https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
</head>
<body>
    <header>
        <div class="heading">
            <h2 id = "title">NUMERAL SYSTEM</h2>
        </div>
        
            <div class="num-one">
                <div class="dec">DECIMAL</div>
                <button class="dec-num"></button>
            </div>
        
            <div class="num-two">
                <div class="binary">BINARY</div>
                <button class="binary-num"></button>
            </div>
        
    </header>
    <div class = "content">
        <div class="board">
            <button class="box clear">AC</button>
            <button class="box" id = "delete"><i class="fa-solid fa-delete-left"></i></button>
            <button class="box sign">**</button>
            <button class="box sign">/</button>
            <button class="box num">7</button>
            <button class="box num">8</button>
            <button class="box num">9</button>
            <button class="box sign">*</button>
            <button class="box num">4</button>
            <button class="box num">5</button>
            <button class="box num">6</button>
            <button class="box sign">-</button>
            <button class="box num binarynum">1</button>
            <button class="box num">2</button>
            <button class="box num">3</button>
            <button class="box sign">+</button>
            <button class="box num binarynum">00</button>
            <button class="box num binarynum">0</button>
            <button class="box num dot">.</button>
            <button class="box equals" id = "equals">=</button>
        </div>
    </div>
    <script src = "Num.js"></script>
</body>
</html>
